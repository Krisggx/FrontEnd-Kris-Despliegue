<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Práctica Despliegue web</title>
  <style>
    :root {
      --verde-oscuro: #0d5e31;
      --verde: #00c218;
      --fondo: #eef5ef;
      --texto: #1f2a24;
      --gris: #5f6b64;
      --error: #b3261e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .tarjeta {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }
    .encabezado {
      background: var(--verde-oscuro);
      color: #fff;
      padding: 20px 24px;
      border-bottom: 5px solid var(--verde);
    }
    .encabezado h1 { margin: 0; font-size: 1.3rem; }
    .encabezado p { margin: 4px 0 0; opacity: 0.85; font-size: 0.9rem; }
    .contenido { padding: 20px 24px 24px; }
    .estado { text-align: center; padding: 24px 0; color: var(--gris); }
    .spinner {
      width: 32px; height: 32px; margin: 0 auto 12px;
      border: 4px solid #d6e8da; border-top-color: var(--verde-oscuro);
      border-radius: 50%; animation: girar 0.9s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    .error {
      background: #fdecea; color: var(--error);
      border: 1px solid #f5c2bd; border-radius: 10px;
      padding: 14px 16px;
    }
    .error strong { display: block; margin-bottom: 4px; }
    .mensaje {
      display: flex; align-items: center; gap: 8px;
      background: #e6f6e9; color: var(--verde-oscuro);
      border-radius: 10px; padding: 10px 14px; font-weight: 600;
      margin-bottom: 16px;
    }
    .insignia {
      background: var(--verde-oscuro); color: #fff;
      border-radius: 6px; padding: 2px 8px; font-size: 0.8rem;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 4px; border-bottom: 1px solid #e3ebe5; }
    th { color: var(--gris); font-weight: 500; width: 40%; text-transform: capitalize; }
    td { font-weight: 600; word-break: break-word; }
    .pie { margin-top: 16px; font-size: 0.85rem; color: var(--gris); }
    .pie code { background: #f1f4f2; padding: 2px 6px; border-radius: 4px; }
    button {
      margin-top: 12px; background: var(--verde-oscuro); color: #fff;
      border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; font: inherit;
    }
  </style>
</head>
<body>
  <main class="tarjeta">
    <header class="encabezado">
      <h1>Despliegue web · Frontend + API</h1>
      <p>UVG Campus Altiplano · Vercel ↔ Render</p>
    </header>
    <section class="contenido" id="contenido">
      <div class="estado">
        <div class="spinner"></div>
        Cargando…
      </div>
    </section>
  </main>

  <script>
    // URL base de la API (sin "/" al final).
    // En local: "http://localhost:3000"
    // En producción: la URL https que asigna Render, p. ej. "https://practica-api-xxxx.onrender.com"
    const API_URL = "https://depliegue-web-kris.onrender.com";

    const contenido = document.getElementById("contenido");

    // Escapa texto para insertarlo en HTML de forma segura.
    function escapar(valor) {
      const div = document.createElement("div");
      div.textContent = String(valor);
      return div.innerHTML;
    }

    function mostrarCargando() {
      contenido.innerHTML = `
        <div class="estado">
          <div class="spinner"></div>
          Cargando…
        </div>`;
    }

    function mostrarError(detalle) {
      contenido.innerHTML = `
        <div class="error">
          <strong>No se pudo obtener la información de la API.</strong>
          ${escapar(detalle)}
        </div>
        <button onclick="cargarDatos()">Reintentar</button>`;
    }

    function mostrarDatos(json) {
      const filas = Object.entries(json.data)
        .map(([campo, valor]) => `<tr><th>${escapar(campo)}</th><td>${escapar(valor)}</td></tr>`)
        .join("");

      const fecha = new Date(json.timestamp);

      contenido.innerHTML = `
        <div class="mensaje">
          <span class="insignia">${escapar(json.status)}</span>
          ${escapar(json.message)}
        </div>
        <table>${filas}</table>
        <p class="pie">
          <strong>Timestamp:</strong> <code>${escapar(json.timestamp)}</code><br />
          (hora local: ${escapar(fecha.toLocaleString("es-GT"))})
        </p>`;
    }

    async function cargarDatos() {
      mostrarCargando();
      try {
        const respuesta = await fetch(API_URL + "/test");
        if (!respuesta.ok) {
          throw new Error(`La API respondió con el código HTTP ${respuesta.status}.`);
        }
        const json = await respuesta.json();
        if (!json.success || !json.data) {
          throw new Error("La respuesta no tiene el formato esperado.");
        }
        mostrarDatos(json);
      } catch (error) {
        mostrarError(error.message);
      }
    }

    // Al cargar la página se consulta la API.
    cargarDatos();
  </script>
</body>
</html>
